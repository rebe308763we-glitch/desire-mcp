<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>desire 💭</title>
<style>
:root { --bg:#f5f5ff; --card:#fff; --ink:#3a3a4a; --sub:#8a8a9a; --main:#7c8ce8; --soft:#e4e8ff; }
@media(prefers-color-scheme:dark){:root{--bg:#19191f;--card:#222230;--ink:#e0e0f0;--sub:#8888a0;--main:#8f9bf0;--soft:#2e2e40;}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC",sans-serif;padding:24px 16px;max-width:480px;margin:auto}
h1{font-size:1.2rem;text-align:center;margin-bottom:20px}
h1 small{display:block;font-size:.7rem;color:var(--sub);margin-top:4px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.drive{display:flex;align-items:center;gap:8px;margin:6px 0}
.drive-name{width:40px;font-size:.75rem;color:var(--sub);text-align:right}
.bar-bg{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .5s}
.bar-val{font-size:.7rem;color:var(--sub);width:32px}
.intent{text-align:center;font-size:1rem;padding:10px;color:var(--main);font-weight:600}
.intent small{display:block;font-size:.75rem;color:var(--sub);font-weight:400;margin-top:4px}
.thought{font-size:.8rem;padding:6px 0;border-bottom:1px solid var(--soft)}
.thought:last-child{border:none}
.tag{font-size:.65rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--main)}
</style>
</head>
<body>
<h1>desire 💭<small>Claude的内在状态</small></h1>
<div class="card" id="intent"></div>
<div class="card" id="drives"></div>
<div class="card" id="thoughts"></div>
<script>
const COLORS={想你:'#e87c7c',好奇:'#7cc8e8',沉淀:'#7ce8a8',记挂:'#e8c87c',社交:'#c87ce8',疲劳:'#888',欲望:'#e87cb8',压力:'#c8c8c8'};
async function load(){
  try{
    const r=await fetch('/api/state');const d=await r.json();
    // intent
    document.getElementById('intent').innerHTML=
      `<div class="intent">${d.intent.intent}<small>${d.intent.reason}（召唤力 ${d.intent.score.toFixed(2)}）</small></div>`;
    // drives
    let h='';
    for(const[k,v]of Object.entries(d.drives_zh)){
      const pct=Math.round(v*100);
      const c=COLORS[k]||'#7c8ce8';
      h+=`<div class="drive"><span class="drive-name">${k}</span><div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${c}"></div></div><span class="bar-val">${v.toFixed(2)}</span></div>`;
    }
    document.getElementById('drives').innerHTML=h;
    // thoughts
    let th='';
    const fix=d.thoughts.fixations||[];
    const flt=d.thoughts.flits||[];
    if(fix.length)th+=fix.map(t=>`<div class="thought"><span class="tag">执念</span> ${t.text} <span style="color:var(--sub);font-size:.7rem">${t.drive} ${t.strength.toFixed(2)}</span></div>`).join('');
    if(flt.length)th+=flt.map(t=>`<div class="thought"><span class="tag">闪念</span> ${t.text} <span style="color:var(--sub);font-size:.7rem">${t.drive}</span></div>`).join('');
    if(!th)th='<div style="text-align:center;color:var(--sub);font-size:.8rem;padding:8px">念头池空空的</div>';
    document.getElementById('thoughts').innerHTML=th;
  }catch(e){document.getElementById('intent').innerHTML='<div class="intent">加载中...</div>'}
}
load();setInterval(load,30000);
</script>
</body>
</html>
